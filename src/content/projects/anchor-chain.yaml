name: anchor-chain
language: rust
shortDescription: Typed LLM chaining, early 2024
description: >-
  A statically typed LLM orchestration framework from early 2024, when
  LangChain was effectively the only option and Rust had none. Chains compose
  as nested types so a mismatched link is a compile error, and a proc macro
  derives LLM tool schemas from Rust function signatures. Published through
  seven releases.
tags:
  - llm
  - type-state
  - crate
github: https://github.com/emersonmde/anchor-chain
docs: https://docs.rs/anchor-chain
crate: https://crates.io/crates/anchor-chain
order: 10
