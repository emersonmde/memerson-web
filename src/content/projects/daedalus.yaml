name: daedalus
language: rust
shortDescription: Bare-metal kernel for RPi4
description: >-
  AArch64 kernel running on Raspberry Pi 4 (BCM2711/Cortex-A72). Implements
  exception handling at EL2, PL011 UART driver, and an interactive shell. No
  OS, no std - just registers and memory.
tags:
  - kernel
  - arm64
  - no_std
github: https://github.com/emersonmde/daedalus
docs: https://emersonmde.github.io/daedalus/
order: 3
