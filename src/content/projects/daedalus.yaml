name: daedalus
language: rust
shortDescription: Bare-metal kernel for RPi4
description: >-
  AArch64 kernel for the Raspberry Pi 4 — hand-built MMU page tables, GIC-400
  interrupts, and a Broadcom GENET Ethernet driver with DMA descriptor rings.
  From-scratch packet path (sk_buffs, ARP, sockets) and kexec-based network
  boot for hot-reloading kernels over Ethernet. CI runs the test suite in
  QEMU.
tags:
  - kernel
  - arm64
  - no_std
github: https://github.com/emersonmde/daedalus
docs: https://emersonmde.github.io/daedalus/
order: 3
