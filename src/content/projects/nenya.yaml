name: nenya
language: rust
shortDescription: Distributed adaptive rate limiter
description: >-
  Coordination-free distributed rate limiting: nodes gossip per-scope
  throughput over UDP and steer local token buckets with pluggable control
  engines — PID and a Kalman-filter Bayesian variant. Per-user scopes promote
  to cluster coordination only on evidence of load. Verified with a
  deterministic cluster simulator, property tests, and stateright model
  checking.
tags:
  - distributed
  - control-theory
  - crate
github: https://github.com/emersonmde/nenya
docs: https://docs.rs/nenya
crate: https://crates.io/crates/nenya
order: 1
