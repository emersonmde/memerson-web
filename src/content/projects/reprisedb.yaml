name: reprisedb
language: rust
shortDescription: LSM Tree key-value store
description: >-
  A first foray into LSM-tree storage: a memtable buffering writes ahead of
  length-prefixed protobuf SSTables carrying bloom filters and sparse
  indexes, merged by streaming compaction. Load-tested to a billion-key
  keyspace with a companion benchmark harness.
tags:
  - storage
  - lsm-tree
  - database
github: https://github.com/emersonmde/reprisedb
order: 11
