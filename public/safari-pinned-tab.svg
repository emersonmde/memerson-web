<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Safari's pinned-tab icon is used as a *mask*: every shape is filled with one
    colour of Safari's choosing, so neither the tube colours nor the glows
    survive. This is the mark's geometry only, flattened to black — the two
    interlocked elbows still read at tab size, which is all a mask can carry.
    The paths match favicon.svg exactly.
  -->
  <g fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 22 V50 H42" />
    <path d="M50 42 V14 H22" />
  </g>
</svg>
